{% extends "base.html" %}

{% block title %}Add Application - InternTrack{% endblock %}

{% block content %}
<h1>Add Application</h1>
<p class="subtitle">Fill in the details of your new application</p>

<div class="panel">
    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form class="form-grid" method="POST" action="/add">
        <label>Company Name
            <input type="text" name="company_name">
        </label>
        <label>Job Role
            <input type="text" name="job_role">
        </label>
        <label>Job Type
            <select name="job_type">
                <option>Internship</option>
                <option>Full-time</option>
            </select>
        </label>
        <label>Location
            <input type="text" name="location">
        </label>
        <label>Applied Date
            <input type="date" name="applied_date">
        </label>
        <label>Deadline
            <input type="date" name="deadline">
        </label>
        <label>Status
            <select name="application_status">
                <option>Applied</option>
                <option>Shortlisted</option>
                <option>Interview</option>
                <option>Selected</option>
                <option>Rejected</option>
            </select>
        </label>
        <label>Job Link
            <input type="text" name="job_link">
        </label>
        <label class="full">Notes
            <textarea name="notes" rows="4"></textarea>
        </label>
        <div class="full">
            <button class="btn" type="submit">Save Application</button>
        </div>
    </form>
</div>
{% endblock %}
